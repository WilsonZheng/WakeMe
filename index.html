<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/style.css" />
    <title>iOSWakeMe – keep your iPhone screen on</title>
    <meta name="description" content="Open a link and your iPhone stops auto-locking. /on keeps the screen awake, /off turns it back to normal." />
  </head>
  <body>
    <main>
      <header class="brand">
        <a href="/">iOSWakeMe</a>
        <button class="lang" type="button" data-i18n="brand.toggle">中文</button>
      </header>
      <h1 data-i18n="home.title">Keep your iPhone screen on.</h1>
      <p class="lead" data-i18n="home.lead"></p>
      <a class="card on" href="/on">
        <h2 data-i18n="home.on.title">Stay awake</h2>
        <p data-i18n="home.on.body"></p>
        <span class="url" data-host>/on</span>
      </a>
      <a class="card off" href="/off">
        <h2 data-i18n="home.off.title">Back to normal</h2>
        <p data-i18n="home.off.body"></p>
        <span class="url" data-host>/off</span>
      </a>
      <p class="tips" data-i18n="home.tip"></p>
      <footer data-i18n="footer"></footer>
    </main>
    <script type="module">
      import { setupLangToggle } from "/assets/i18n.js";
      setupLangToggle();
      for (const el of document.querySelectorAll("[data-host]")) el.textContent = location.host + el.textContent;
    </script>
  </body>
</html>
